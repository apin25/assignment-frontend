stages:
  - build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: hafizmuh/scele-fe-app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: node:20
  before_script:
    - npm install -g pnpm
  script:
    - pnpm install --frozen-lockfile
    - pnpm run type-check || echo "Type-check failed but continuing build."
    - pnpm run build-only
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

docker-push:
  stage: docker-push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build --build-arg VITE_BE_POST_URL=$VITE_BE_POST_URL --build-arg VITE_BE_AUTH_URL=$VITE_BE_AUTH_URL -t $DOCKER_IMAGE_NAME:$IMAGE_TAG .
    - docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml

    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/k8s"
    - scp deployment.yaml $EC2_USER@$EC2_HOST:~/app/k8s/deployment.yaml
    - scp k8s/service.yaml $EC2_USER@$EC2_HOST:~/app/k8s/service.yaml

    - ssh $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/deployment.yaml"
    - ssh $EC2_USER@$EC2_HOST "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/service.yaml"
  only:
    - main